context:
  version: "3.0.9"

package:
  name: ammonite-repl
  version: ${{ version }}

source:
  - git: https://github.com/com-lihaoyi/Ammonite
    tag: ${{ version }}
  - url: https://github.com/com-lihaoyi/Ammonite/archive/refs/tags/${{ version }}.tar.gz
    sha256: fea5ff63bee2baa0cd3badb7fbb5ab0c4275f43e88ac9250e99f92e27f654a5f
    target_directory: archive

build:
  number: 0
  noarch: generic

requirements:
  build:
    - curl
    - findutils
    - git
    - maven
    - openjdk =17
  run:
    - openjdk =17

tests:
  - script:
      - amm --help

about:
  license: MIT
  license_file:
    - LICENSE
    - target/generated-resources/licenses/
  summary: Scala Scripting
  homepage: https://github.com/com-lihaoyi/Ammonite
  repository: https://github.com/com-lihaoyi/Ammonite

extra:
  recipe-maintainers:
    - danielnachun
